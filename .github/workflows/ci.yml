name: CI

# CI en cada PR a develop/main. CD tras pasar los checks, con la misma imagen
# que probó el CI (no se reconstruye):
#   push a develop → Docker Hub `develop` + `<short SHA>`
#   push a main    → Docker Hub `latest`  + `<short SHA>`
#   tag vX.Y.Z     → Docker Hub `vX.Y.Z`  + `<short SHA>` (release fija para Render)
# Solo publica la imagen; el servicio (Render u otro) la toma de Docker Hub.
# Secrets: DOCKER_USERNAME, DOCKER_TOKEN (token de acceso de Docker Hub).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv y Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --all-groups --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Formato (ruff format)
        run: uv run ruff format --check .

      - name: Pruebas (pytest)
        run: uv run python -m pytest -q

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lazarus-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sin red y sin secretos: CORS_ORIGINS es la única variable obligatoria.
      - name: Prueba de humo (la app carga dentro de la imagen)
        run: docker run --rm --network none -e CORS_ORIGINS='["http://localhost"]' lazarus-backend:ci python -c "import app.main"

      # En develop y main la imagen probada viaja al job de publicación.
      - name: Guardar la imagen probada
        if: github.event_name == 'push'
        run: docker save lazarus-backend:ci | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  publish:
    name: Publicar imagen
    if: github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/lazarus-backend
      # vX.Y.Z = release etiquetada; latest = main; develop = la rama de integración.
      CHANNEL: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || (github.ref == 'refs/heads/main' && 'latest' || 'develop') }}
    steps:
      - name: Obtener short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: image

      - name: Cargar la imagen probada (no se reconstruye)
        run: gunzip -c image.tar.gz | docker load

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push a Docker Hub (canal y short SHA)
        run: |
          for tag in "$CHANNEL" "${{ steps.vars.outputs.SHORT_SHA }}"; do
            docker tag lazarus-backend:ci "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
          {
            echo "### Imagen publicada"
            echo "- \`$IMAGE:$CHANNEL\` y \`$IMAGE:${{ steps.vars.outputs.SHORT_SHA }}\`"
            echo "- No se despliega sola: el servicio la toma de Docker Hub."
          } >> "$GITHUB_STEP_SUMMARY"
